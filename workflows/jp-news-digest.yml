    - data:
        code: "import json\n\ndef main(articles_json: str) -> dict:\n    data = json.loads(articles_json)\n\
          \    labels = {\n        \"nikkei\": \"日経新聞\", \"asahi\": \"朝日新聞\", \"sankei\"\
          : \"産経新聞\",\n        \"reuters_jp\": \"Reuters JP\", \"toyokeizai\": \"\
          東洋経済\", \"nhk\": \"NHK\",\n    }\n    suffixes = (\" - 日本経済新聞\", \" - 朝日新聞デジタル\"\
          , \" - 朝日新聞\",\n                \" - 産経ニュース\", \" - 産経新聞\", \" - ロイター (Reuters\
          \ Japan)\",\n                \" - ロイター\", \" - 東洋経済オンライン\")\n    lines =\
          \ []\n    count = 0\n    for key, src in data.get(\"sources\", {}).items():\n\
          \        lines.append(f\"## {labels.get(key, key)}\")\n        if src.get(\"\
          status\") != \"ok\":\n            lines.append(f\"(取得失敗: {src.get('error',\
          \ '不明')})\")\n            continue\n        for it in src.get(\"items\"\
          , []):\n            title = (it.get(\"title\") or \"\").strip()\n      \
          \      for suf in suffixes:\n                if title.endswith(suf):\n \
          \                   title = title[: -len(suf)]\n                    break\n\
          \            lines.append(f\"- {title} ({it.get('pub_date', '')})\")\n \
          \           lines.append(f\"  {it.get('url', '')}\")\n            count\
          \ += 1\n        lines.append(\"\")\n    return {\"formatted_articles\":\
          \ \"\\n\".join(lines), \"article_count\": count}\n"
        code_language: python3
        outputs:
          article_count:
            children: null
            type: number
          formatted_articles:
            children: null
            type: string
