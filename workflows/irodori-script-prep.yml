    - data:
        code: "import json\n\n_BAR = \"  # =====================================================================\"\n\n\ndef\
          \ _esc(s):\n    return str(s).replace(\"\\\\\", \"\\\\\\\\\").replace('\"', '\\\\\"').replace(\"\\n\", \"\\\\n\"\
          )\n\n\ndef _emit_yaml(data):\n    d = data if isinstance(data, dict) else {}\n    defaults = d.get(\"defaults\"\
          ) or {}\n    sp = defaults.get(\"speaker\", \"sota\")\n    refs = defaults.get(\"refs\") or {\"sota\": \"samples/sota_calm.wav\"\
          , \"rin\": \"samples/rin_pure.wav\"}\n    try:\n        pa = int(defaults.get(\"pause_after_ms\", 500))\n    except\
          \ Exception:\n        pa = 500\n    try:\n        pc = int(defaults.get(\"pause_change_speaker_ms\", 1200))\n  \
          \  except Exception:\n        pc = 1200\n\n    out = []\n    title = d.get(\"title\")\n    if isinstance(title,\
          \ str) and title:\n        out.append('title: \"%s\"' % _esc(title))\n    out.append('source: \"Dify irodori-script-prep\
          \ (題材直貼り)\"')\n    out.append(\"defaults:\")\n    out.append(\"  speaker: %s\" % sp)\n    out.append(\"  pause_after_ms:\
          \ %d\" % pa)\n    out.append(\"  pause_change_speaker_ms: %d\" % pc)\n    out.append(\"  refs:\")\n    if isinstance(refs,\
          \ dict):\n        for k, v in refs.items():\n            out.append(\"    %s: %s\" % (k, v))\n    out.append(\"\"\
          )\n    out.append(\"lines:\")\n    for ln in d.get(\"lines\", []) or []:\n        if not isinstance(ln, dict):\n\
          \            continue\n        sec = ln.get(\"section\")\n        if isinstance(sec, str) and sec.strip():\n   \
          \         out.append(_BAR)\n            out.append(\"  # %s\" % sec.strip())\n            out.append(_BAR)\n   \
          \     out.append(\"  - speaker: %s\" % ln.get(\"speaker\", sp))\n        out.append('    text: \"%s\"' % _esc(ln.get(\"\
          text\", \"\")))\n        if \"pause_after_ms\" in ln:\n            try:\n                out.append(\"    pause_after_ms:\
          \ %d\" % int(ln[\"pause_after_ms\"]))\n            except Exception:\n                pass\n    return \"\\n\".join(out)\
          \ + \"\\n\"\n\n\ndef _load_glossary(s):\n    s = (s or \"\").strip()\n    if s.startswith(\"```\"):\n        s =\
          \ s.split(\"\\n\", 1)[1] if \"\\n\" in s else \"\"\n        if s.endswith(\"```\"):\n            s = s[:-3]\n  \
          \      s = s.strip()\n    g = None\n    try:\n        g = json.loads(s)\n    except Exception:\n        a = s.find(\"\
          {\")\n        b = s.rfind(\"}\")\n        if a >= 0 and b > a:\n            try:\n                g = json.loads(s[a:b\
          \ + 1])\n            except Exception:\n                g = None\n    if not isinstance(g, dict):\n        return\
          \ {}\n    clean = {}\n    for k, v in g.items():\n        if k == \"_note\":\n            clean[\"_note\"] = v\n\
          \        elif isinstance(k, str) and isinstance(v, str):\n            clean[k] = v\n    return clean\n\n\ndef main(script_json,\
          \ glossary_text):\n    try:\n        data = json.loads(script_json or \"{}\")\n    except Exception:\n        data\
          \ = {}\n    return {\n        \"script_processed_yaml\": _emit_yaml(data),\n        \"glossary_json\": json.dumps(_load_glossary(glossary_text),\
          \ ensure_ascii=False, indent=2),\n    }"
