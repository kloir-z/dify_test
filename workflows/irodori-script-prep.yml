    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: claude-sonnet-4-5
          provider: langgenius/anthropic/anthropic
        prompt_template:
        - id: 3000100011-sys
          role: system
          text: "あなたは Irodori-TTS 台本の修正者です。与えられた台本 (JSON) と check 警告を読み、警告を解消する最小限の修正をして JSON を返します。\n\n# ルール\n- 警告レポートの先頭が「問題なし」または「警告\
