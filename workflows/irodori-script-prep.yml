    - data:
        code: "import json\nimport re\n\n# ---- preprocess (prepare_irodori_text.py 移植) ----\n_ANGLE_OPEN = \"〈《\"   # 〈 《\n\
          _ANGLE_CLOSE = \"〉》\"  # 〉 》\n_BRACKET_PAIR = r\"[「『][^」』]*[」』]\"  # 「『 ... 」』\n_BRACKET_GLUE = r\"[、と・]{0,2}\"\
          \                       # 、と・\n_BRACKET_SEQ = re.compile(_BRACKET_PAIR + r\"(?:\" + _BRACKET_GLUE + _BRACKET_PAIR\
          \ + r\"){2,}\")\n_BRACKET_INNER = re.compile(r\"[「『]([^」』]*)[」』]\")\n_KANJI = \"〇一二三四五六七八九\"  # 〇一二三四五六七八九\n_KMAP\
          \ = {c: str(i) for i, c in enumerate(_KANJI)}\n_NZ = \"一二三四五六七八九\"  # 一..九 (先頭非ゼロ)\n_DIG = \"〇一二三四五六七八九\"\n_KY4\
          \ = re.compile(\"[\" + _NZ + \"][\" + _DIG + \"]{3}(?=年)\")\n_KY2 = re.compile(\"(?<![、,])[\" + _NZ + \"]〇(?=年)\"\
          )\n_KC = re.compile(\"[\" + _NZ + \"][\" + _DIG + \"]?(?=世紀)\")\n_MULT = re.compile(r\"(?<=[0-9０-９])\\s*[×✕✖]\\\
          s*(?=[0-9０-９])\")\n\n\ndef _conv_k(m):\n    return \"\".join(_KMAP[c] for c in m.group(0))\n\n\ndef preprocess(text):\n\
          \    for c in _ANGLE_OPEN:\n        text = text.replace(c, \"「\")\n    for c in _ANGLE_CLOSE:\n        text = text.replace(c,\
          \ \"」\")\n    text = _BRACKET_SEQ.sub(lambda m: \"、\".join(_BRACKET_INNER.findall(m.group(0))), text)\n    text\
          \ = _KY4.sub(_conv_k, text)\n    text = _KY2.sub(_conv_k, text)\n    text = _KC.sub(_conv_k, text)\n    text = _MULT.sub(\"\
          かける\", text)  # かける\n    return text\n\n\n# ---- check (check_irodori_text.py 移植 + 拡張) ----\n# YOMI_DICT 対象語(info)。modal_app.py\
          \ の YOMI_DICT と同期。\n_YOMI_WORDS = [\n    \"州立大学\", \"子音\", \"音色\", \"概観\", \"上側頭溝\",\n    \"恭しく\", \"嗅球\", \"末梢\"\
          , \"糸球体\", \"較正\", \"紡錘状\",\n    \"米イラン\", \"米中\", \"米国\", \"米軍\", \"米政治\",\n    \"原油安\", \"終値\", \"辺野古抗議活動\",\n\
          \    \"萌芽\", \"蝸牛\", \"私的\", \"松尾豊\", \"暦本純一\",\n    \"東大五月祭\",\n]\n# P12 漢数字範囲 (N、N〇年)\n_KANJI_YEAR_RANGE = re.compile(\"\
          [\" + _NZ + \"]、[\" + _NZ + \"]〇(?=年)\")\n# NAME 相手呼びかけ。原実装は コトハ/ソウタ。現行デフォルト女声 rin を追加(制約#23)。\n_NAME_CALL = re.compile(r\"\
          (?:コトハ|ソウタ|リン)さん\")\n# PAREN 括弧書き注釈\n_PAREN = re.compile(r\"[（(][^）)]+[）)]\")\n# EMOJI\n_EMOJI = re.compile(\n \
          \   \"[\" \"\\U0001F300-\\U0001FAFF\" \"\\U00002600-\\U000027BF\"\n    \"\\U00002B00-\\U00002BFF\" \"\\U0001F1E6-\\\
          U0001F1FF\" \"]\"\n)\n_LINEEND_STRIP = \"。、．，！？!?…―─」』）)】〕\\\"' 　\\t\\n\"\n\n\ndef _check_line(text):\n    w = []\n\
          \    n_ku = text.count(\"。\")  # 。\n    if n_ku >= 2:\n        w.append(\"P1 句点%d個(複数文): 1 line=1 文\" % n_ku)\n\
          \    roman = re.findall(r\"(?:^|(?<=[、, \\s]))([a-zA-Z]{1,2})(?=[、, \\s]|$)\", text)\n    roman = [h for h in roman\
          \ if not h.isupper()]\n    if roman:\n        w.append(\"P3 ローマ字単独(%s): カタカナ化\" % \", \".join(roman[:5]))\n    eng\
          \ = re.findall(r\"[a-z]{3,}\", text)\n    if eng:\n        w.append(\"P4 英単語(%s): カタカナ化(制約#9)\" % \", \".join(eng[:5]))\n\
          \    if _KANJI_YEAR_RANGE.search(text):\n        w.append(\"P12 漢数字範囲(N、N〇年): アラビア数字の範囲に\")\n    m = _NAME_CALL.search(text)\n\
          \    if m:\n        w.append(\"NAME 相手の名前呼びかけ(%s): 名前を抜く(制約#23)\" % m.group())\n    if _PAREN.search(text):\n  \
          \      w.append(\"PAREN 括弧書き注釈: 地の文に(制約#24)\")\n    if _EMOJI.search(text):\n        tail = text.rstrip(_LINEEND_STRIP)\n\
          \        if tail and _EMOJI.search(tail[-2:]):\n            w.append(\"EMOJI 行末絵文字: 文中へ(制約#8)\")\n    n_ten = text.count(\"\
          、\")  # 、\n    if n_ten > 3:\n        w.append(\"TEN 読点%d個: 1 lineあたり3個まで(制約#1)\" % n_ten)\n    return w\n\n\ndef\
          \ _load(s):\n    s = (s or \"\").strip()\n    if s.startswith(\"```\"):\n        s = s.split(\"\\n\", 1)[1] if \"\
          \\n\" in s else \"\"\n        if s.endswith(\"```\"):\n            s = s[:-3]\n        s = s.strip()\n    try:\n\
          \        return json.loads(s), None\n    except Exception as e:\n        a = s.find(\"{\")\n        b = s.rfind(\"\
          }\")\n        if a >= 0 and b > a:\n            try:\n                return json.loads(s[a:b + 1]), None\n    \
          \        except Exception as e2:\n                return {\"lines\": []}, str(e2)\n        return {\"lines\": []},\
          \ str(e)\n\n\ndef main(script_json):\n    data, err = _load(script_json)\n    lines = data.get(\"lines\", []) if\
          \ isinstance(data, dict) else []\n\n    for ln in lines:\n        if isinstance(ln, dict) and isinstance(ln.get(\"\
          text\"), str):\n            ln[\"text\"] = preprocess(ln[\"text\"])\n\n    report = []\n    warn_n = 0\n    all_text\
          \ = \"\"\n    for i, ln in enumerate(lines, 1):\n        t = ln.get(\"text\", \"\") if isinstance(ln, dict) else\
          \ \"\"\n        all_text += t\n        for msg in _check_line(t):\n            warn_n += 1\n            report.append(\"\
          L%d %s : 「%s」\" % (i, msg, t[:40]))\n\n    ratio = (all_text.count(\"、\") / len(all_text) * 100) if all_text else\
          \ 0.0\n    if ratio > 5.0:\n        warn_n += 1\n        report.append(\"全体 読点%.1f/100字 (>5.0): 読点を減らす(制約#1)\" %\
          \ ratio)\n\n    if err is not None:\n        head = \"JSON解析エラー: %s\" % err\n        warn_n += 1\n    elif warn_n\
          \ == 0:\n        head = \"問題なし(警告 0 件) / 読点 %.1f/100字 / %d lines\" % (ratio, len(lines))\n    else:\n        head\
          \ = \"警告 %d 件 / 読点 %.1f/100字 / %d lines\" % (warn_n, ratio, len(lines))\n\n    info = [v for v in _YOMI_WORDS if\
          \ v in all_text]\n    if info:\n        report.append(\"[INFO] YOMI_DICT対象語(自動置換): %s\" % \", \".join(info[:8]))\n\
          \n    warnings_text = head + (\"\\n\" + \"\\n\".join(report) if report else \"\")\n    return {\n        \"processed_json\"\
          : json.dumps(data, ensure_ascii=False),\n        \"warnings_text\": warnings_text,\n    }"
