    - data:
        code: "import re\nfrom datetime import datetime, timedelta, timezone\n\nENTITIES = {\"&amp;\": \"&\", \"&lt;\": \"\
          <\", \"&gt;\": \">\", \"&quot;\": '\"', \"&#39;\": \"'\", \"&apos;\": \"'\"}\n\n\ndef unescape(text: str) -> str:\n\
          \    for k, v in ENTITIES.items():\n        text = text.replace(k, v)\n    return text\n\n\nMONTHS = {\"Jan\": 1,\
          \ \"Feb\": 2, \"Mar\": 3, \"Apr\": 4, \"May\": 5, \"Jun\": 6,\n          \"Jul\": 7, \"Aug\": 8, \"Sep\": 9, \"\
          Oct\": 10, \"Nov\": 11, \"Dec\": 12}\n# 名前付きTZ→UTCからの分。文字列に書かれたTZをそのまま信頼して変換する(推測しない)\nTZ_NAMES = {\"GMT\": 0, \"\
          UTC\": 0, \"UT\": 0, \"Z\": 0, \"JST\": 540,\n            \"EST\": -300, \"EDT\": -240, \"CST\": -360, \"CDT\":\
          \ -300,\n            \"MST\": -420, \"MDT\": -360, \"PST\": -480, \"PDT\": -420}\n\n\ndef _tzoff(tz):\n    tz =\
          \ tz.strip()\n    if tz in TZ_NAMES:\n        return TZ_NAMES[tz]\n    if tz[:1] == \"+\":\n        sign = 1\n \
          \   elif tz[:1] == \"-\":\n        sign = -1\n    else:\n        return None\n    body = tz[1:].replace(\":\", \"\
          \")\n    if len(body) < 4:\n        return None\n    try:\n        return sign * (int(body[0:2]) * 60 + int(body[2:4]))\n\
          \    except ValueError:\n        return None\n\n\ndef _parse_rfc822(raw):\n    parts = raw.replace(\",\", \" \"\
          ).split()\n    if len(parts) < 5:\n        return None\n    try:\n        tz = parts[-1]\n        hms = parts[-2].split(\"\
          :\")\n        year = int(parts[-3])\n        mon = MONTHS.get(parts[-4][:3])\n        day = int(parts[-5])\n   \
          \     hh = int(hms[0]); mm = int(hms[1]); ss = int(hms[2]) if len(hms) > 2 else 0\n    except (ValueError, IndexError):\n\
          \        return None\n    off = _tzoff(tz)\n    if mon is None or off is None:\n        return None\n    return\
          \ datetime(year, mon, day, hh, mm, ss, tzinfo=timezone(timedelta(minutes=off)))\n\n\ndef _parse_iso(raw):\n    s\
          \ = raw if \"T\" in raw else raw.replace(\" \", \"T\", 1)\n    try:\n        year = int(s[0:4]); mon = int(s[5:7]);\
          \ day = int(s[8:10])\n    except (ValueError, IndexError):\n        return None\n    rest = s[11:]\n    if not rest:\n\
          \        return None\n    off = None\n    if rest[-1:] in (\"Z\", \"z\"):\n        off = 0\n        rest = rest[:-1]\n\
          \    else:\n        cut = -1\n        for i in range(len(rest) - 1, -1, -1):\n            if rest[i] in \"+-\":\n\
          \                cut = i\n                break\n        if cut >= 0:\n            off = _tzoff(rest[cut:])\n  \
          \          rest = rest[:cut]\n    if off is None:\n        return None\n    hms = rest.split(\".\")[0].split(\"\
          :\")\n    try:\n        hh = int(hms[0]); mm = int(hms[1]); ss = int(hms[2]) if len(hms) > 2 else 0\n    except\
          \ (ValueError, IndexError):\n        return None\n    return datetime(year, mon, day, hh, mm, ss, tzinfo=timezone(timedelta(minutes=off)))\n\
          \n\ndef to_jst(raw):\n    raw = (raw or \"\").strip()\n    if not raw:\n        return \"\"\n    if len(raw) >=\
          \ 10 and raw[4:5] == \"-\" and raw[7:8] == \"-\":\n        dt = _parse_iso(raw)\n    else:\n        dt = _parse_rfc822(raw)\n\
          \    if dt is None:\n        return raw\n    jst = dt.astimezone(timezone(timedelta(hours=9)))\n    return jst.strftime(\"\
          %Y-%m-%d %H:%M JST\")\n\n\ndef parse_rss(xml_text: str, limit: int = 15) -> list:\n    items = []\n    for m in\
          \ re.finditer(r\"<item>([\\s\\S]*?)</item>\", xml_text or \"\"):\n        block = m.group(1)\n\n        def field(tag:\
          \ str) -> str:\n            f = re.search(\n                r\"<\" + tag + r\">(?:<!\\[CDATA\\[)?([\\s\\S]*?)(?:\\\
          ]\\]>)?</\" + tag + r\">\", block\n            )\n            return unescape(f.group(1).strip()) if f else \"\"\
          \n\n        title = field(\"title\")\n        if title:\n            if \" - \" in title:\n                title\
          \ = title.rsplit(\" - \", 1)[0]\n            items.append({\"title\": title, \"url\": field(\"link\"), \"pub_date\"\
          : field(\"pubDate\")})\n        if len(items) >= limit:\n            break\n    return items\n\n\ndef main(body_nikkei:\
          \ str, body_asahi: str, body_sankei: str,\n         body_reuters: str, body_toyokeizai: str) -> dict:\n    sources\
          \ = [\n        (\"日経新聞\", body_nikkei),\n        (\"朝日新聞\", body_asahi),\n        (\"産経新聞\", body_sankei),\n   \
          \     (\"Reuters JP\", body_reuters),\n        (\"東洋経済\", body_toyokeizai),\n    ]\n    lines = [\"## \U0001F4F0\
          \ 国内ニュース\", \"\"]\n    count = 0\n    for name, body in sources:\n        lines.append(f\"### {name}\")\n      \
          \  items = parse_rss(body)\n        if not items:\n            lines.append(\"(取得失敗または0件)\")\n        for it in\
          \ items:\n            lines.append(f\"- {it['title']}\")\n            lines.append(f\"  {it['url']}\")\n       \
          \     lines.append(f\"  {to_jst(it['pub_date'])}\")\n            count += 1\n        lines.append(\"\")\n\n    jst_now\
          \ = datetime.now(timezone(timedelta(hours=9)))\n    date_label = f\"{jst_now.year}年{jst_now.month}月{jst_now.day}日\"\
          \n\n    return {\n        \"formatted_articles\": \"\\n\".join(lines),\n        \"date_label\": date_label,\n  \
          \  }"
