    - data:
        code: "import json\nimport re\nfrom datetime import datetime, timedelta, timezone\n\nENTITIES = {\"&amp;\": \"&\"\
          , \"&lt;\": \"<\", \"&gt;\": \">\", \"&quot;\": '\"', \"&#39;\": \"'\", \"&apos;\": \"'\"}\n\n\ndef unescape(text):\n\
          \    for k, v in ENTITIES.items():\n        text = text.replace(k, v)\n    return text\n\n\ndef field(block, tag):\n\
          \    f = re.search(r\"<\" + tag + r\"[^>]*>(?:<!\\[CDATA\\[)?([\\s\\S]*?)(?:\\]\\]>)?</\" + tag + r\">\", block)\n\
          \    return unescape(f.group(1).strip()) if f else \"\"\n\n\nMONTHS = {\"Jan\": 1, \"Feb\": 2, \"Mar\": 3, \"Apr\"\
          : 4, \"May\": 5, \"Jun\": 6,\n          \"Jul\": 7, \"Aug\": 8, \"Sep\": 9, \"Oct\": 10, \"Nov\": 11, \"Dec\": 12}\n\
          # 名前付きTZ→UTCからの分。文字列に書かれたTZをそのまま信頼して変換する(推測しない)\nTZ_NAMES = {\"GMT\": 0, \"UTC\": 0, \"UT\": 0, \"Z\": 0, \"JST\"\
          : 540,\n            \"EST\": -300, \"EDT\": -240, \"CST\": -360, \"CDT\": -300,\n            \"MST\": -420, \"MDT\"\
          : -360, \"PST\": -480, \"PDT\": -420}\n\n\ndef _tzoff(tz):\n    tz = tz.strip()\n    if tz in TZ_NAMES:\n      \
          \  return TZ_NAMES[tz]\n    if tz[:1] == \"+\":\n        sign = 1\n    elif tz[:1] == \"-\":\n        sign = -1\n\
          \    else:\n        return None\n    body = tz[1:].replace(\":\", \"\")\n    if len(body) < 4:\n        return None\n\
          \    try:\n        return sign * (int(body[0:2]) * 60 + int(body[2:4]))\n    except ValueError:\n        return\
          \ None\n\n\ndef _parse_rfc822(raw):\n    # 例: \"Sun, 14 Jun 2026 21:15:38 GMT\" / \"Mon, 15 Jun 2026 09:00:00 +0000\"\
          \n    parts = raw.replace(\",\", \" \").split()\n    if len(parts) < 5:\n        return None\n    try:\n       \
          \ tz = parts[-1]\n        hms = parts[-2].split(\":\")\n        year = int(parts[-3])\n        mon = MONTHS.get(parts[-4][:3])\n\
          \        day = int(parts[-5])\n        hh = int(hms[0]); mm = int(hms[1]); ss = int(hms[2]) if len(hms) > 2 else\
          \ 0\n    except (ValueError, IndexError):\n        return None\n    off = _tzoff(tz)\n    if mon is None or off\
          \ is None:\n        return None\n    return datetime(year, mon, day, hh, mm, ss, tzinfo=timezone(timedelta(minutes=off)))\n\
          \n\ndef _parse_iso(raw):\n    # 例: \"2026-06-15T09:00:00Z\" / \"...000Z\" / \"...+09:00\" / \"...-04:00\"\n    s\
          \ = raw if \"T\" in raw else raw.replace(\" \", \"T\", 1)\n    try:\n        year = int(s[0:4]); mon = int(s[5:7]);\
          \ day = int(s[8:10])\n    except (ValueError, IndexError):\n        return None\n    rest = s[11:]\n    if not rest:\n\
          \        return None\n    off = None\n    if rest[-1:] in (\"Z\", \"z\"):\n        off = 0\n        rest = rest[:-1]\n\
          \    else:\n        cut = -1\n        for i in range(len(rest) - 1, -1, -1):\n            if rest[i] in \"+-\":\n\
          \                cut = i\n                break\n        if cut >= 0:\n            off = _tzoff(rest[cut:])\n  \
          \          rest = rest[:cut]\n    if off is None:\n        return None  # TZ不明は変換しない(誤変換防止)\n    hms = rest.split(\"\
          .\")[0].split(\":\")\n    try:\n        hh = int(hms[0]); mm = int(hms[1]); ss = int(hms[2]) if len(hms) > 2 else\
          \ 0\n    except (ValueError, IndexError):\n        return None\n    return datetime(year, mon, day, hh, mm, ss,\
          \ tzinfo=timezone(timedelta(minutes=off)))\n\n\ndef to_jst(raw):\n    \"\"\"埋め込みTZを読み取りJSTへ変換。既に+09:00ならそのまま。読めなければ素通し\"\
          \"\"\n    raw = (raw or \"\").strip()\n    if not raw:\n        return \"\"\n    if len(raw) >= 10 and raw[4:5]\
          \ == \"-\" and raw[7:8] == \"-\":\n        dt = _parse_iso(raw)\n    else:\n        dt = _parse_rfc822(raw)\n  \
          \  if dt is None:\n        return raw\n    jst = dt.astimezone(timezone(timedelta(hours=9)))\n    return jst.strftime(\"\
          %Y-%m-%d %H:%M JST\")\n\n\ndef parse_rss(xml_text, strip_suffix=False, limit=15):\n    \"\"\"RSS 2.0 の <item> と\
          \ Atom の <entry> 両対応\"\"\"\n    items = []\n    blocks = re.findall(r\"<item>([\\s\\S]*?)</item>\", xml_text or\
          \ \"\")\n    if blocks:\n        for block in blocks:\n            title = field(block, \"title\")\n           \
          \ if title:\n                if strip_suffix and \" - \" in title:\n                    title = title.rsplit(\"\
          \ - \", 1)[0]\n                items.append({\"title\": title, \"url\": field(block, \"link\"), \"pub_date\": field(block,\
          \ \"pubDate\")})\n            if len(items) >= limit:\n                break\n        return items\n    for block\
          \ in re.findall(r\"<entry>([\\s\\S]*?)</entry>\", xml_text or \"\")[:limit]:\n        title = field(block, \"title\"\
          )\n        m = re.search(r'<link[^>]*href=\"([^\"]+)\"', block)\n        pub = field(block, \"updated\") or field(block,\
          \ \"published\")\n        if title:\n            items.append({\"title\": title, \"url\": m.group(1) if m else \"\
          \", \"pub_date\": pub})\n    return items\n\n\ndef parse_hn(json_text, limit=25):\n    \"\"\"Hacker News (Algolia\
          \ API) の JSON。points を注目度として見出しに付ける\"\"\"\n    items = []\n    try:\n        hits = json.loads(json_text or \"{}\"\
          ).get(\"hits\", [])\n    except Exception:\n        return items\n    for h in hits[:limit]:\n        title = h.get(\"\
          title\") or \"\"\n        if not title:\n            continue\n        url = h.get(\"url\") or \"https://news.ycombinator.com/item?id=\"\
          \ + str(h.get(\"objectID\", \"\"))\n        items.append({\"title\": \"[\" + str(h.get(\"points\", 0)) + \" pts]\
          \ \" + title,\n                      \"url\": url, \"pub_date\": h.get(\"created_at\", \"\")})\n    return items\n\
          \n\ndef main(body_ap, body_reuters, body_wsj, body_ars, body_hn,\n         body_simonw, body_nautilus, body_aeon):\n\
          \    sources = [\n        (\"AP News\", parse_rss(body_ap, strip_suffix=True)),\n        (\"Reuters\", parse_rss(body_reuters,\
          \ strip_suffix=True)),\n        (\"WSJ\", parse_rss(body_wsj, strip_suffix=True)),\n        (\"Ars Technica\", parse_rss(body_ars)),\n\
          \        (\"Hacker News\", parse_hn(body_hn)),\n        (\"Simon Willison\", parse_rss(body_simonw, limit=10)),\n\
          \        (\"Nautilus\", parse_rss(body_nautilus, limit=10)),\n        (\"Aeon\", parse_rss(body_aeon, limit=10)),\n\
          \    ]\n    lines = [\"## \U0001F310 海外ニュース\", \"\"]\n    url_map = {}\n    count = 0\n    for name, items in sources:\n\
          \        lines.append(\"### \" + name)\n        if not items:\n            lines.append(\"(取得失敗または0件)\")\n     \
          \   for it in items:\n            count += 1\n            url_map[str(count)] = it[\"url\"]\n            # URLは翻訳に不要な巨大トークン。連番プレースホルダに退避し後段で復元する。\n\
          \            # 統合ダイジェスト共通体裁: 見出し / URL行 / 日時行 をそれぞれ独立行にする\n            lines.append(\"- \" + it[\"title\"])\n  \
          \          lines.append(\"  [[\" + str(count) + \"]]\")\n            lines.append(\"  \" + to_jst(it[\"pub_date\"\
          ]))\n        lines.append(\"\")\n\n    jst_now = datetime.now(timezone(timedelta(hours=9)))\n    date_label = str(jst_now.year)\
          \ + \"年\" + str(jst_now.month) + \"月\" + str(jst_now.day) + \"日\"\n\n    return {\n        \"formatted_articles\"\
          : \"\\n\".join(lines),\n        \"url_map\": json.dumps(url_map, ensure_ascii=False),\n    }"
        code_language: python3
