    - data:
        code: "import json\nimport re\nfrom datetime import datetime, timedelta, timezone\n\nENTITIES = {\"&amp;\": \"&\"\
          , \"&lt;\": \"<\", \"&gt;\": \">\", \"&quot;\": '\"', \"&#39;\": \"'\", \"&apos;\": \"'\"}\n\n\ndef unescape(text):\n\
          \    for k, v in ENTITIES.items():\n        text = text.replace(k, v)\n    return text\n\n\ndef field(block, tag):\n\
          \    f = re.search(r\"<\" + tag + r\"[^>]*>(?:<!\\[CDATA\\[)?([\\s\\S]*?)(?:\\]\\]>)?</\" + tag + r\">\", block)\n\
          \    return unescape(f.group(1).strip()) if f else \"\"\n\n\ndef parse_rss(xml_text, strip_suffix=False, limit=15):\n\
          \    \"\"\"RSS 2.0 の <item> と Atom の <entry> 両対応\"\"\"\n    items = []\n    blocks = re.findall(r\"<item>([\\s\\\
          S]*?)</item>\", xml_text or \"\")\n    if blocks:\n        for block in blocks:\n            title = field(block,\
          \ \"title\")\n            if title:\n                if strip_suffix and \" - \" in title:\n                   \
          \ title = title.rsplit(\" - \", 1)[0]\n                items.append({\"title\": title, \"url\": field(block, \"\
          link\"), \"pub_date\": field(block, \"pubDate\")})\n            if len(items) >= limit:\n                break\n\
          \        return items\n    for block in re.findall(r\"<entry>([\\s\\S]*?)</entry>\", xml_text or \"\")[:limit]:\n\
          \        title = field(block, \"title\")\n        m = re.search(r'<link[^>]*href=\"([^\"]+)\"', block)\n       \
          \ pub = field(block, \"updated\") or field(block, \"published\")\n        if title:\n            items.append({\"\
          title\": title, \"url\": m.group(1) if m else \"\", \"pub_date\": pub})\n    return items\n\n\ndef parse_hn(json_text,\
          \ limit=25):\n    \"\"\"Hacker News (Algolia API) の JSON。points を注目度として見出しに付ける\"\"\"\n    items = []\n    try:\n\
          \        hits = json.loads(json_text or \"{}\").get(\"hits\", [])\n    except Exception:\n        return items\n\
          \    for h in hits[:limit]:\n        title = h.get(\"title\") or \"\"\n        if not title:\n            continue\n\
          \        url = h.get(\"url\") or \"https://news.ycombinator.com/item?id=\" + str(h.get(\"objectID\", \"\"))\n  \
          \      items.append({\"title\": \"[\" + str(h.get(\"points\", 0)) + \" pts] \" + title,\n                      \"\
          url\": url, \"pub_date\": h.get(\"created_at\", \"\")})\n    return items\n\n\ndef main(body_ap, body_reuters, body_wsj,\
          \ body_ars, body_hn,\n         body_simonw, body_nautilus, body_aeon):\n    sources = [\n        (\"AP News\", parse_rss(body_ap,\
          \ strip_suffix=True)),\n        (\"Reuters\", parse_rss(body_reuters, strip_suffix=True)),\n        (\"WSJ\", parse_rss(body_wsj,\
          \ strip_suffix=True)),\n        (\"Ars Technica\", parse_rss(body_ars)),\n        (\"Hacker News\", parse_hn(body_hn)),\n\
          \        (\"Simon Willison\", parse_rss(body_simonw, limit=10)),\n        (\"Nautilus\", parse_rss(body_nautilus,\
          \ limit=10)),\n        (\"Aeon\", parse_rss(body_aeon, limit=10)),\n    ]\n    lines = []\n    count = 0\n    for\
          \ name, items in sources:\n        lines.append(\"## \" + name)\n        if not items:\n            lines.append(\"\
          (取得失敗または0件)\")\n        for it in items:\n            lines.append(\"- \" + it[\"title\"] + \" (\" + it[\"pub_date\"\
          ] + \")\")\n            lines.append(\"  \" + it[\"url\"])\n            count += 1\n        lines.append(\"\")\n\
          \n    jst_now = datetime.now(timezone(timedelta(hours=9)))\n    date_label = str(jst_now.year) + \"年\" + str(jst_now.month)\
          \ + \"月\" + str(jst_now.day) + \"日\"\n\n    return {\n        \"formatted_articles\": \"\\n\".join(lines),\n   \
          \     \"article_count\": count,\n        \"date_label\": date_label,\n    }"
