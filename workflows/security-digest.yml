          value_type: string
          variable: body_cisa
        - value_selector:
          - '2000100004'
          - body
          value_type: string
          variable: body_cisco
        - value_selector:
          - '2000100005'
          - body
          value_type: string
          variable: body_hn
        - value_selector:
          - '2000100001'
          - seen_cves
          value_type: string
          variable: seen_cves
      height: 52
      id: '2000100007'
      position:
        x: 320
        y: 360
      positionAbsolute:
        x: 320
        y: 360
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        outputs:
        - value_selector:
          - '2000100007'
          - hot_json
          value_type: string
          variable: hot_json
        - value_selector:
          - '2000100007'
          - date_label
          value_type: string
          variable: date_label
        selected: false
        title: 出力
        type: end
      height: 90
